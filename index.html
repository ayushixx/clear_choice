<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>CLEAR CHOICE — Know the Facts. Choose Your Future.</title>
    <meta name="description" content="A modern, deeply personal awareness platform for drug education, addiction awareness, recovery stories, and crisis intervention." />
    
    <meta name="theme-color" content="#FFFFFF" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="apple-status-bar-meta" />

    <!-- Instant theme sync script to prevent FOUT on mobile & enforce explicit manual selection -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('clearchoice_theme');
          var isDark;
          if (saved === 'dark' || saved === 'light') {
            isDark = saved === 'dark';
          } else {
            isDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          }
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
          var themeMeta = document.getElementById('theme-color-meta');
          if (themeMeta) themeMeta.content = isDark ? '#0A0A0C' : '#FFFFFF';
          var appleMeta = document.getElementById('apple-status-bar-meta');
          if (appleMeta) appleMeta.content = isDark ? 'black-translucent' : 'default';

          function syncBody() {
            if (document.body) {
              if (isDark) {
                document.body.classList.add('dark');
              } else {
                document.body.classList.remove('dark');
              }
            }
          }
          if (document.body) {
            syncBody();
          } else {
            document.addEventListener('DOMContentLoaded', syncBody);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased selection:bg-[#E03590] selection:text-white overflow-x-hidden font-sans transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
