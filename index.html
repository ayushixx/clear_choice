<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>CLEAR CHOICE — Know the Facts. Choose Your Future.</title>
    <meta name="description" content="A modern, deeply personal awareness platform for drug education, addiction awareness, recovery stories, and crisis intervention." />
    
    <!-- Instant theme sync script to prevent FOUT on mobile & enforce explicit manual selection -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('clearchoice_theme');
          var isDark;
          if (saved === 'dark' || saved === 'light') {
            isDark = saved === 'dark';
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
          console.log('[CLEAR CHOICE DEBUG] Inline pre-render theme initialized:', isDark ? 'dark' : 'light', '| Saved:', saved);
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased selection:bg-[#E03590] selection:text-white overflow-x-hidden font-sans transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
